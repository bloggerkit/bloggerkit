name: Build and test (reusable)

on: [workflow_call]

# env:
#   TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
#   TURBO_TEAM: ${{ secrets.TURBO_TEAM }}
#   TURBO_CACHE: remote:rw

jobs:
  build_typecheck:
    name: Typecheck
    uses: ./.github/workflows/build-reusable.yml
    with:
      afterBuild: pnpm run typecheck
      os: '["ubuntu-latest"]'
    secrets: inherit

  test:
    name: Test
    uses: ./.github/workflows/build-reusable.yml
    with:
      afterBuild: pnpm run test
      os: '["ubuntu-latest"]'
    secrets: inherit
