name: Build (reusable)

on:
  workflow_call:
    inputs:
      skipInstallBuild:
        required: false
        description: "whether to skip pnpm install && pnpm build"
        type: string
      os:
        required: false
        description: "operating systems to run build on"
        type: string
      nodeVersion:
        required: false
        description: "version of Node.js to use"
        type: string
      pnpmVersion:
        required: false
        description: "version of pnpm to use"
        type: string
      afterBuild:
        required: false
        description: "additional steps to run"
        type: string

# env:
#   TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
#   TURBO_TEAM: ${{ secrets.TURBO_TEAM }}
#   TURBO_CACHE: remote:rw

jobs:
  build:
    name: Build on Node.js ${{ matrix.node-version }} (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        node-version: ${{ fromJson(inputs.nodeVersion || '["22.x","24.x"]') }}
        os: ${{ fromJson(inputs.os || '["ubuntu-latest","windows-latest"]') }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Set up Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install
        if: ${{ inputs.skipInstallBuild != 'yes' }}

      - name: Build packages
        run: pnpm run build
        if: ${{ inputs.skipInstallBuild != 'yes' }}

      - name: Run post-build command
        shell: bash
        run: ${{ inputs.afterBuild }}
